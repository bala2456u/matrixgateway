services:
  db:
    image: postgres:16-alpine
    container_name: rupeeramp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rupeeramp
      POSTGRES_PASSWORD: rupeeramp_dev_secret
      POSTGRES_DB: rupeeramp
    ports:
      - "5433:5432"
    volumes:
      - rupeeramp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rupeeramp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rupeeramp_pgdata:
